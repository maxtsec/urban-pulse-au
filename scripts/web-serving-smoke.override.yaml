services:
  api:
    # Rehearse the shared network namespace used by a Cloud Run API sidecar.
    network_mode: service:web
    # Match the hosted sidecar: reachable only inside the shared network namespace.
    command: ["/app/.venv/bin/python", "-m", "uvicorn", "apps.api.main:app", "--host", "127.0.0.1", "--port", "8000", "--workers", "1", "--no-server-header"]
    depends_on: !override
      postgres: {condition: service_healthy}
      city-init: {condition: service_completed_successfully}
      web: {condition: service_started}
  web:
    depends_on: !reset {}
    # No API_UPSTREAM override: exercise the default localhost upstream.
    environment: !override
      PORT: "8088"
    ports: !override ["127.0.0.1::8088"]
