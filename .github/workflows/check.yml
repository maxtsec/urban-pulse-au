name: Project checks
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: urbanpulse
          POSTGRES_PASSWORD: urbanpulse_local
          POSTGRES_DB: urbanpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urbanpulse -d urbanpulse"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow syntax
        run: >-
          docker run --rm --network none -v "$PWD:/repo:ro" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - run: uv sync --locked
      - run: uv run --locked ruff check . && uv run --locked ruff format --check .
      - run: uv run --locked mypy && uv run --locked pytest -q
      - run: uv run --locked pytest -m integration -q
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci && npm run lint && npm run format:check && npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: city-browser-evidence
          path: |
            .local/city01/*.png
            .local/city02/*.png
            .local/city03/*.png
            apps/web/test-results/

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
      # Static validation only: no cloud credentials, backend or plan in CI.
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/bootstrap init -backend=false -input=false
      - run: terraform -chdir=infra/bootstrap validate

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -O scripts/web_build_smoke.py
      - run: python scripts/compose_smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: python -O -m scripts.web_serving_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-smoke-evidence
          path: |
            .local/compose-smoke/
            .local/web-serving-smoke/
            apps/web/test-results/serving/
            .local/web-build-smoke/*/docker.log
            .local/web-build-smoke/*/*-inventory.json
