name: Project checks
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: urbanpulse
          POSTGRES_PASSWORD: urbanpulse_local
          POSTGRES_DB: urbanpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urbanpulse -d urbanpulse"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate workflow syntax
        run: >-
          docker run --rm --network none -v "$PWD:/repo:ro" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.23'
      - run: uv sync --locked
      - run: uv run --locked ruff check . && uv run --locked ruff format --check .
      - run: uv run --locked mypy && uv run --locked pytest -q
      - name: Strictly type-check the Linux collector host guard
        run: uv run --locked mypy --strict --platform linux scripts/collector_host.py
      - run: uv run --locked pytest -m integration -q
      - name: Verify isolated Linux capture recovery
        run: |
          docker build --target test -f workers/capture/Dockerfile -t urbanpulse-capture:test .
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 512m \
            urbanpulse-capture:test
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Check offline chunk experiment helpers
        run: node --test scripts/tram_chunk_experiments.test.mjs
      - run: npm ci && npm run lint && npm run format:check && npm run test:unit && npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: city-browser-evidence
          path: |
            .local/city01/*.png
            .local/city02/*.png
            .local/city03/*.png
            apps/web/test-results/

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.4
      # Validation and mocked plans only: no cloud credentials, remote backend or apply.
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/bootstrap init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/bootstrap validate
      - run: terraform -chdir=infra/demo-foundation init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/demo-foundation validate
      - run: terraform -chdir=infra/demo-foundation test
      - run: terraform -chdir=infra/demo-jobs init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/demo-jobs validate
      - run: terraform -chdir=infra/demo-jobs test
      - run: terraform -chdir=infra/demo-serving init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/demo-serving validate
      - run: terraform -chdir=infra/demo-serving test
      - run: terraform -chdir=infra/demo-cd init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/demo-cd validate
      - run: terraform -chdir=infra/demo-cd test

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python -O scripts/web_build_smoke.py
      - run: python scripts/compose_smoke.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: python -O -m scripts.web_serving_smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compose-smoke-evidence
          path: |
            .local/compose-smoke/
            .local/web-serving-smoke/
            apps/web/test-results/serving/
            .local/web-build-smoke/*/docker.log
            .local/web-build-smoke/*/*-inventory.json
