[project]
name = "urbanpulse-au"
version = "0.1.0"
description = "UrbanPulse AU development baseline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi", "uvicorn[standard]", "pydantic", "pydantic-settings", "sqlalchemy",
  "psycopg[binary]", "alembic", "redis", "httpx", "polars",
  "google-auth", "google-cloud-storage", "google-cloud-bigquery", "opentelemetry-api",
  "opentelemetry-sdk", "opentelemetry-instrumentation-fastapi", "prometheus-client",
]

[dependency-groups]
capture = ["httpx", "pydantic", "google-auth"]
capture-test = [{include-group = "capture"}, "pytest", "cryptography"]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pyyaml>=6.0.3",
    "gtfs-realtime-bindings>=2.2.0",
]
pipeline = ["dagster", "dagster-webserver", "dbt-bigquery"]

[tool.uv]
default-groups = ["dev", "pipeline"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/api", "workers/ingestion", "workers/events", "workers/city", "workers/initialization", "workers/capture", "urbanpulse", "scripts/image_publication.py", "scripts/demo_database.py", "scripts/demo_delivery.py", "scripts/demo_delivery_runner.py", "scripts/demo_delivery_seed.py", "scripts/gtfs_probe.py", "scripts/transport_probe.py", "scripts/source_probe.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: requires a real local PostGIS service"]
pythonpath = ["."]
