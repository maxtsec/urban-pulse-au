name: urbanpulse
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: urbanpulse
      POSTGRES_PASSWORD: urbanpulse_local
      POSTGRES_DB: urbanpulse
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanpulse -d urbanpulse"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  city-init:
    profiles: [app]
    image: "${COMPOSE_PROJECT_NAME:-urbanpulse}-api:local"
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://urbanpulse:urbanpulse_local@postgres:5432/urbanpulse
    command:
      - /bin/sh
      - -ec
      - uv run --no-sync python -m urbanpulse.adapters.city_store migrate && uv run --no-sync python -m workers.ingestion.main --city-fixture
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  api:
    profiles: [app]
    image: "${COMPOSE_PROJECT_NAME:-urbanpulse}-api:local"
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://urbanpulse:urbanpulse_local@postgres:5432/urbanpulse
      REDIS_URL: redis://redis:6379/0
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      city-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
  recovery-worker:
    profiles: [recovery]
    image: "${COMPOSE_PROJECT_NAME:-urbanpulse}-api:local"
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://urbanpulse:urbanpulse_local@postgres:5432/urbanpulse
    command: [/app/.venv/bin/python, -m, workers.events.main, run]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  web:
    profiles: [app]
    build:
      context: apps/web
    environment:
      VITE_API_PROXY: http://api:8000
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [api]
volumes:
  postgres_data:
